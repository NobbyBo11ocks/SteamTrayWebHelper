name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Build
        working-directory: src
        run: |
          mkdir -p bin
          windres res/icon.rc -O coff -o bin/icon.res
          gcc -Oz -Wall -Wextra -Werror \
              -Wl,--gc-sections,--exclude-all-symbols,--dynamicbase,--nxcompat,--high-entropy-va \
              -municode -shared -nostdlib -s \
              Library.c bin/icon.res -lkernel32 -luser32 -ladvapi32 -lshell32 -lgdi32 \
              -o bin/umpdc.dll

      - name: Checksum
        working-directory: src/bin
        run: sha256sum umpdc.dll | tee umpdc.dll.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: umpdc
          path: |
            src/bin/umpdc.dll
            src/bin/umpdc.dll.sha256

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src/bin/umpdc.dll
            src/bin/umpdc.dll.sha256
