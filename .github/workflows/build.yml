name: Build

on:
  push:
    # Releases are cut from tags. Both shapes are accepted because the repo's
    # own history uses the bare form ("1.0.0", "1.2.0") while the badges and
    # docs elsewhere use a "v" prefix - matching only one of them would leave
    # real tags silently building without ever publishing a release.
    branches: [main]
    tags: ["v*", "[0-9]+.[0-9]+.[0-9]+*"]
  pull_request:
  workflow_dispatch:

# Superseded pushes to the same branch don't need to finish; tag builds are
# never cancelled, since those are the ones that publish a release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      # Create the release and upload its assets.
      contents: write
      # The three below are what actions/attest needs on a tag build: id-token
      # mints the OIDC token used to request a Sigstore signing certificate,
      # attestations persists the attestation, and artifact-metadata creates the
      # artifact storage record.
      id-token: write
      attestations: write
      artifact-metadata: write
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-python-pillow
            mingw-w64-ucrt-x86_64-python-numpy

      - name: Verify generated icons are up to date
        working-directory: src/res
        run: |
          python -c "import PIL, numpy; print('Pillow', PIL.__version__, '| numpy', numpy.__version__)"

          # Compared by decoded pixels, NOT by file bytes. Two Pillow builds of
          # the very same version emit different bytes for identical images -
          # they link different zlib/libimagequant, so the deflate stream inside
          # each ICO frame differs. Verified: MSYS2's Pillow 12.3.0 and the
          # windows CPython wheel's Pillow 12.3.0 produce icons that are
          # pixel-identical at all 9 sizes yet share no SHA-256. A byte compare
          # therefore fails permanently for anyone whose Pillow build isn't the
          # one the committed icons happened to be generated on, which says
          # nothing about whether the icons are actually stale.
          #
          # Regenerated into a scratch dir rather than over the checked-out
          # files, so the DLL below always embeds exactly what is committed.
          rm -rf _iconcheck && mkdir _iconcheck
          cp make_icon.py steam_logo_source.png _iconcheck/
          (cd _iconcheck && python make_icon.py)

          # A relative path on purpose: MSYS2's python is a native Windows
          # binary and cannot resolve MSYS paths like /tmp/....
          python - <<'PY'
          import sys

          import numpy as np
          from PIL.IcoImagePlugin import IcoFile

          problems = []
          for name in ("icon_on.ico", "icon_off.ico"):
              with open(name, "rb") as fa, open("_iconcheck/" + name, "rb") as fb:
                  a, b = IcoFile(fa), IcoFile(fb)
                  sa, sb = sorted(a.sizes()), sorted(b.sizes())
                  if sa != sb:
                      problems.append("%s: sizes %s != %s" % (name, sa, sb))
                      continue
                  for s in sa:
                      pa = np.array(a.getimage(s).convert("RGBA"))
                      pb = np.array(b.getimage(s).convert("RGBA"))
                      if pa.shape != pb.shape or not np.array_equal(pa, pb):
                          problems.append("%s @ %dx%d" % (name, s[0], s[1]))

          if problems:
              print("::error::Committed icons do not match make_icon.py's output (%s)."
                    " Rerun make_icon.py from src/res and commit the result." % "; ".join(problems))
              sys.exit(1)

          print("icons match make_icon.py output: pixel-identical at every size")
          PY

          rm -rf _iconcheck

      - name: Build
        working-directory: src
        run: |
          mkdir -p bin
          windres res/icon.rc -O coff -o bin/icon.res
          gcc -Oz -Wall -Wextra -Werror \
              -Wl,--gc-sections,--exclude-all-symbols,--dynamicbase,--nxcompat,--high-entropy-va \
              -Wl,--no-insert-timestamp,--image-base,0x180000000 \
              -municode -shared -nostdlib -s \
              Library.c bin/icon.res -lkernel32 -luser32 -ladvapi32 -lshell32 -lgdi32 \
              -o bin/umpdc.dll

      # Advisory, deliberately not -Werror and deliberately not part of the link
      # above. -fanalyzer is a deeper interprocedural pass than -Wall/-Wextra and
      # its false-positive set shifts between GCC releases; with `update: true`
      # pulling a new GCC whenever MSYS2 ships one, making it fatal would sooner
      # or later fail a release over an analyzer regression rather than a real
      # defect. Findings still surface as annotations on the run.
      - name: Static analysis (advisory)
        working-directory: src
        run: gcc -Oz -Wall -Wextra -fanalyzer -municode -shared -nostdlib -c Library.c -o /dev/null

      # The installer bundles the DLL built above, so it has to run after it.
      # Inno Setup 6 is preinstalled on the windows-latest runner image; the
      # PATH lookup is tried first so this keeps working if the image ever
      # stops shipping it at the default location.
      - name: Build installer
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) { throw "Inno Setup (ISCC.exe) not found on this runner." }
          & $iscc installer\NoSteamWebHelper.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }

      - name: Checksums
        run: |
          # Hashed from inside each directory so the digest file names the bare
          # file, which is what makes `sha256sum -c` work in the folder someone
          # downloaded the release assets into.
          (cd src/bin && sha256sum umpdc.dll | tee umpdc.dll.sha256)
          (cd installer/Output && sha256sum SteamTrayWebHelper.exe | tee SteamTrayWebHelper.exe.sha256)

      # The build is byte-for-byte reproducible, but only against the same
      # toolchain: ld stamps its own version into the PE header, so a different
      # binutils changes the file (and its checksum) without changing a single
      # instruction. Publishing the versions turns "rebuild and compare" from a
      # claim into something someone can actually carry out, instead of hitting
      # a two-byte mismatch with no way to know why.
      - name: Record toolchain
        run: |
          # Each version goes through a command substitution rather than being
          # piped straight into the group. The msys2 shell runs with pipefail,
          # and `tool --version | head -1` can report the tool as failed when
          # head closes the pipe first; inside $(...) the exit status is the
          # echo's, so this cannot fail the build over its own formatting.
          {
            echo "SteamTrayWebHelper reproducible-build toolchain"
            echo "commit:  ${{ github.sha }}"
            echo "ref:     ${{ github.ref }}"
            echo
            echo "gcc:     $(gcc --version | head -1)"
            echo "ld:      $(ld --version | head -1)"
            echo "windres: $(windres --version | head -1)"
            echo "python:  $(python -c 'import sys, PIL, numpy; print("Pillow", PIL.__version__, "numpy", numpy.__version__, "on", sys.version.split()[0])')"
          } | tee toolchain.txt

      - uses: actions/upload-artifact@v7
        with:
          name: SteamTrayWebHelper
          path: |
            src/bin/umpdc.dll
            src/bin/umpdc.dll.sha256
            installer/Output/SteamTrayWebHelper.exe
            installer/Output/SteamTrayWebHelper.exe.sha256
            toolchain.txt
          if-no-files-found: error

      # Signed SLSA build provenance binding each released binary's digest to
      # this commit and workflow run, verifiable with:
      #   gh attestation verify umpdc.dll --repo NobbyBo11ocks/SteamTrayWebHelper
      # Free on public repositories. Runs before Release so a failure here never
      # leaves published assets without provenance, and only on tags - a
      # pull_request from a fork is not granted id-token: write, so attesting
      # every event would fail those runs for no benefit.
      - name: Attest build provenance
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest@v4
        with:
          subject-path: |
            src/bin/umpdc.dll
            installer/Output/SteamTrayWebHelper.exe

      # Without an explicit body the release page is blank and GitHub falls back
      # to showing the tagged commit's subject line, truncated - which is what
      # 1.2.2 and 1.2.3 shipped with. Pull the matching section out of
      # CHANGELOG.md instead so the notes say something a reader can use.
      - name: Build release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python - <<'PY'
          import os, pathlib, re

          tag = os.environ["GITHUB_REF_NAME"]
          version = tag[1:] if tag[:1].lower() == "v" else tag
          changelog = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")

          # The section runs from its own "## <version>" heading to the next
          # "## " heading, or to end of file for the newest entry.
          match = re.search(r"^##\s+%s\s*$(.*?)(?=^##\s|\Z)" % re.escape(version),
                            changelog, re.MULTILINE | re.DOTALL)
          notes = match.group(1).strip() if match else ""

          if not notes:
              # A warning, not an error: a missing changelog entry is a docs
              # omission, and failing here would block the release itself.
              # generate_release_notes still gives the page a Full Changelog link.
              print("::warning::CHANGELOG.md has no '## %s' section; "
                    "release notes will be auto-generated only." % version)

          pathlib.Path("release-notes.md").write_text(notes + "\n", encoding="utf-8")
          print("release notes: %d chars" % len(notes))
          PY

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          # Matches the naming the earlier hand-made releases used. Set
          # explicitly because the default is the bare tag, and because an
          # unset field would otherwise be left untouched on a re-run.
          name: SteamTrayWebHelper ${{ github.ref_name }}
          body_path: release-notes.md
          # Appends GitHub's own "Full Changelog" comparison link beneath the
          # changelog section written above.
          generate_release_notes: true
          # Asset names are what README.md's download buttons link to via
          # /releases/latest/download/<name> - renaming either breaks those.
          files: |
            src/bin/umpdc.dll
            src/bin/umpdc.dll.sha256
            installer/Output/SteamTrayWebHelper.exe
            installer/Output/SteamTrayWebHelper.exe.sha256
            toolchain.txt
          fail_on_unmatched_files: true
